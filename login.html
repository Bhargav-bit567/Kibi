<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kibi - Login</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#005da7",
            "primary-container": "#2976c7",
            "on-primary": "#ffffff",
            surface: "#f9f9fc",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f3f3f6",
            "surface-variant": "#e2e2e5",
            "on-surface": "#1a1c1e",
            "on-surface-variant": "#414751",
            "outline-variant": "#c1c7d3",
            outline: "#717783"
          }
        }
      }
    }
  </script>

  <script>
    (function() {
      const key = 'kibi_theme';
      const saved = localStorage.getItem(key);
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved ? saved === 'dark' : prefersDark) document.documentElement.classList.add('dark');
    })();
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; }

    html.dark body { background-color: #0B0F17; color: #E8EAED; }
    html.dark body .bg-white { background-color: #161B22 !important; }
    html.dark body .text-\[\#1a1c1e\],
    html.dark body h1,
    html.dark body h2,
    html.dark body label,
    html.dark body .text-\[\#414751\] { color: #F1F3F4 !important; }
    html.dark body .text-\[\#717783\] { color: #9AA0A6 !important; }
    html.dark body .border-\[\#c1c7d3\], html.dark body .border-\[\#e2e2e5\] { border-color: rgba(255,255,255,0.12) !important; }
    html.dark body input { background-color: #161B22 !important; border-color: rgba(255,255,255,0.12) !important; color: #E8EAED !important; }
    html.dark body input::placeholder { color: #6E7681 !important; }
    html.dark body .social-btn { background-color: #161B22 !important; border-color: rgba(255,255,255,0.12) !important; color: #E8EAED !important; }
    html.dark body .social-btn:hover { background-color: rgba(255,255,255,0.05) !important; }

    /* Error styles */
    .form-error { display: block; color: #ba1a1a; font-size: 0.75rem; margin-top: 0.375rem; }
    .input-error { border-color: #ba1a1a !important; }

    /* Toast notification */
    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      padding: 0.875rem 1.25rem; border-radius: 0.75rem;
      background: #1a1c1e; color: #fff; font-size: 0.875rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      opacity: 0; transform: translateY(1rem);
      transition: all 0.3s ease; pointer-events: none; z-index: 9999;
    }
    .toast.active { opacity: 1; transform: translateY(0); }
    .toast.success { background: #1b5e20; }
    .toast.error   { background: #c62828; }
  </style>
</head>

<body class="bg-white text-[#1a1c1e] min-h-screen flex">

  <main class="min-h-screen flex w-full">

    <!-- Left: Hero Image (desktop only) -->
    <div class="hidden lg:flex lg:w-1/2 relative bg-cover bg-center"
         style="background-image: url('https://images.unsplash.com/photo-1483728642387-6c3bdd6c93e5?q=80&w=1600&auto=format&fit=crop')"
         aria-label="Snow-capped alpine mountains" role="img">
      <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
      <div class="absolute bottom-0 left-0 right-0 p-12 text-white">
        <span class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/20 backdrop-blur border border-white/30 text-sm mb-6">
          <span class="material-symbols-outlined text-lg">auto_awesome</span>
          Magical Journeys
        </span>
        <h2 class="text-4xl font-bold mb-3 max-w-lg" style="font-family: 'Outfit', sans-serif;">Your next great adventure awaits.</h2>
        <p class="text-white/90 max-w-md">Let our AI curate a personalized journey tailored to your dreams and budget.</p>
      </div>
    </div>

    <!-- Right: Login Form -->
    <div class="w-full lg:w-1/2 flex flex-col justify-center px-8 sm:px-16 lg:px-24 py-12">
      <div class="w-full max-w-[420px] mx-auto">

        <!-- Logo + Theme Toggle -->
        <div class="mb-12 flex items-center justify-between">
          <a href="index.html" class="text-2xl font-bold text-[#005da7] dark:text-[#7EB8FF]" style="font-family: 'Outfit', sans-serif;">Kibi</a>
          <button type="button" id="themeToggleBtn" class="w-10 h-10 rounded-full border border-[#c1c7d3] dark:border-white/10 flex items-center justify-center text-[#717783] dark:text-[#9AA0A6] hover:bg-[#f3f3f6] dark:hover:bg-white/5 transition-colors" aria-label="Toggle theme">
            <svg id="themeIconMoon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
            <svg id="themeIconSun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          </button>
        </div>

        <!-- Heading -->
        <div class="mb-8">
          <h1 class="text-3xl font-bold mb-1" style="font-family: 'Outfit', sans-serif;">Welcome Back</h1>
          <p class="text-[#414751]">Log in to continue planning your perfect trip.</p>
        </div>

        <!-- Form -->
        <form id="loginForm" action="index.html" class="space-y-5">

          <!-- Email -->
          <div>
            <label for="email" class="block text-sm font-semibold mb-1">Email Address</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#717783]">mail</span>
              <input id="email" type="email" required placeholder="hello@example.com"
                class="form-input w-full pl-12 pr-4 py-3 rounded-xl border border-[#c1c7d3] bg-white focus:border-[#005da7] focus:ring-2 focus:ring-[#005da7]/20 outline-none transition"/>
            </div>
          </div>

          <!-- Password -->
          <div>
            <div class="flex justify-between items-center mb-1">
              <label for="password" class="block text-sm font-semibold">Password</label>
              <a href="#" class="text-sm text-[#005da7] hover:underline">Forgot password?</a>
            </div>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#717783]">lock</span>
              <input id="password" type="password" required placeholder="••••••••"
                class="form-input w-full pl-12 pr-12 py-3 rounded-xl border border-[#c1c7d3] bg-white focus:border-[#005da7] focus:ring-2 focus:ring-[#005da7]/20 outline-none transition"/>
              <button type="button" class="password-toggle absolute right-4 top-1/2 -translate-y-1/2 text-[#717783] hover:text-[#1a1c1e] focus:outline-none" aria-label="Toggle password visibility">
                <span class="material-symbols-outlined text-[20px]">visibility_off</span>
              </button>
            </div>
          </div>

          <!-- Submit -->
          <button type="submit"
            class="w-full py-3.5 rounded-full bg-[#005da7] text-white font-semibold hover:bg-[#2976c7] hover:shadow-lg transition-all duration-200 active:scale-[0.98] mt-2">
            Log In
          </button>
        </form>

        <!-- Divider -->
        <div class="relative flex items-center py-6">
          <div class="flex-grow border-t border-[#e2e2e5]"></div>
          <span class="mx-4 text-xs text-[#414751] uppercase tracking-wide">Or continue with</span>
          <div class="flex-grow border-t border-[#e2e2e5]"></div>
        </div>

        <!-- Social Login Buttons -->
        <div class="grid grid-cols-2 gap-4">
          <button type="button" data-provider="google"
            class="social-btn flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-[#c1c7d3] bg-white hover:bg-[#f3f3f6] text-sm font-semibold transition">
            <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google
          </button>
          <button type="button" data-provider="apple"
            class="social-btn flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-[#c1c7d3] bg-white hover:bg-[#f3f3f6] text-sm font-semibold transition">
            <svg class="w-5 h-5" viewBox="0 0 384 512" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
            </svg>
            Apple
          </button>
        </div>

        <!-- Sign up link -->
        <p class="text-center mt-8 text-sm text-[#414751]">
          Don't have an account?
          <a href="signup.html" class="text-[#005da7] font-semibold hover:underline ml-1">Sign up for free</a>
        </p>

      </div>
    </div>
  </main>

  <!-- SDKs -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // Toggle show/hide password
    document.querySelectorAll('.password-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = btn.parentElement.querySelector('input');
        const icon  = btn.querySelector('.material-symbols-outlined');
        const show  = input.type === 'password';
        input.type       = show ? 'text' : 'password';
        icon.textContent = show ? 'visibility' : 'visibility_off';
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      });
    });

    // Theme toggle wiring
    (function() {
      const moon = document.getElementById('themeIconMoon');
      const sun = document.getElementById('themeIconSun');
      const btn = document.getElementById('themeToggleBtn');
      function sync() {
        const isDark = document.documentElement.classList.contains('dark');
        if (moon) moon.classList.toggle('hidden', isDark);
        if (sun) sun.classList.toggle('hidden', !isDark);
      }
      if (btn) btn.addEventListener('click', () => {
        const isDark = document.documentElement.classList.contains('dark');
        document.documentElement.classList.toggle('dark', !isDark);
        localStorage.setItem('kibi_theme', isDark ? 'light' : 'dark');
        sync();
      });
      sync();
    })();
  </script>
</body>
</html>
