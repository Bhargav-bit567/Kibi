<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wandermatch Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Fallback palette in case js/tailwind-config.js isn't present in this deployment.
    // If that file loads after this and redefines tailwind.config, its values win.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1e3a5f',
            accent: '#e07a5f',
            sage: '#81b29a',
            charcoal: '#2b2d2e',
            cream: '#f4f1ea',
            error: '#dc2626',
            'brand-blue': '#3b82f6'
          }
        }
      }
    };
  </script>
  <script src="js/tailwind-config.js" onerror="this.remove()"></script>
  <style>
    body { -webkit-font-smoothing: antialiased; }
    .sidebar-link.active { background-color: #1e3a5f; color: #fff; }
    .sidebar-link.active svg { color: #fff; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .modal-backdrop { background: rgba(15, 23, 42, 0.5); }
    .toast { animation: toast-in .25s ease-out; }
    @keyframes toast-in { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform:none;} }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
    .role-badge-admin { background:#1e3a5f1a; color:#1e3a5f; }
    .role-badge-moderator { background:#e07a5f1a; color:#b9552f; }
    .role-badge-user { background:#e5e7eb; color:#374151; }
    .status-badge-active { background:#dcfce7; color:#166534; }
    .status-badge-suspended { background:#fef9c3; color:#854d0e; }
    .status-badge-banned { background:#fee2e2; color:#991b1b; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

  <!-- ============ ACCESS GATE ============ -->
  <div id="accessGate" class="min-h-screen flex items-center justify-center p-6 hidden">
    <div class="max-w-md w-full bg-white shadow-lg rounded-2xl p-8 text-center">
      <div class="w-14 h-14 mx-auto rounded-full bg-red-50 flex items-center justify-center mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-red-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" /></svg>
      </div>
      <h1 id="gateTitle" class="text-xl font-bold text-gray-900 mb-2">Admin access required</h1>
      <p id="gateMessage" class="text-gray-500 text-sm mb-6">You need to be signed in with an admin account to view this dashboard.</p>
      <div id="gateActions" class="space-y-3"></div>
    </div>
  </div>

  <!-- ============ DASHBOARD SHELL ============ -->
  <div id="dashboardShell" class="hidden min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 shrink-0 bg-white border-r border-gray-200 flex flex-col">
      <div class="px-6 py-5 border-b border-gray-100">
        <div class="text-lg font-bold text-primary">Wandermatch</div>
        <div class="text-xs text-gray-400 tracking-wide uppercase">Admin Dashboard</div>
      </div>
      <nav class="flex-1 px-3 py-4 space-y-1" id="sidebarNav">
        <button data-tab="tab-dashboard" class="sidebar-link active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" /></svg>
          Dashboard
        </button>
        <button data-tab="tab-users" class="sidebar-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" /></svg>
          Users
          <span id="navUserCount" class="ml-auto text-xs bg-gray-100 text-gray-500 rounded-full px-2 py-0.5">0</span>
        </button>
        <button data-tab="tab-trips" class="sidebar-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 6.75V15m6-6v8.25m.503 3.498l4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 00-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.379 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.158.69.158 1.006 0z" /></svg>
          Trips
          <span id="navTripCount" class="ml-auto text-xs bg-gray-100 text-gray-500 rounded-full px-2 py-0.5">0</span>
        </button>
        <button data-tab="tab-requests" class="sidebar-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          Join Requests
          <span id="navRequestCount" class="ml-auto text-xs bg-amber-100 text-amber-700 rounded-full px-2 py-0.5">0</span>
        </button>
        <button data-tab="tab-activity" class="sidebar-link w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          Activity Log
        </button>
      </nav>
      <div class="px-3 py-4 border-t border-gray-100">
        <div id="sidebarUser" class="flex items-center gap-3 px-3 py-2"></div>
        <button id="logoutBtn" class="w-full mt-1 flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-100 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" /></svg>
          Log out
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 min-w-0">
      <header class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between sticky top-0 z-10">
        <h1 id="pageTitle" class="text-xl font-semibold text-gray-900">Dashboard</h1>
        <div class="flex items-center gap-3">
          <span id="lastUpdated" class="text-xs text-gray-400"></span>
          <button id="refreshBtn" class="text-sm px-3 py-1.5 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors">Refresh</button>
        </div>
      </header>

      <div class="p-8 max-w-7xl mx-auto">

        <!-- ===== DASHBOARD TAB ===== -->
        <section id="tab-dashboard" class="tab-panel active">
          <div id="statsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"></div>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white shadow rounded-xl p-6">
              <h3 class="font-semibold text-gray-900 mb-4">Recent Users</h3>
              <div id="recentUsers" class="space-y-3"></div>
            </div>
            <div class="bg-white shadow rounded-xl p-6">
              <h3 class="font-semibold text-gray-900 mb-4">Recent Activity</h3>
              <div id="recentActivity" class="space-y-3"></div>
            </div>
          </div>
        </section>

        <!-- ===== USERS TAB ===== -->
        <section id="tab-users" class="tab-panel">
          <div class="flex flex-col sm:flex-row gap-3 sm:items-center justify-between mb-4">
            <div class="relative flex-1 max-w-sm">
              <input id="userSearch" type="text" placeholder="Search name or email..." class="w-full pl-9 pr-3 py-2 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
              <svg class="w-4 h-4 text-gray-400 absolute left-3 top-2.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" /></svg>
            </div>
            <div class="flex items-center gap-2">
              <select id="userRoleFilter" class="text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none">
                <option value="">All roles</option>
                <option value="admin">Admin</option>
                <option value="moderator">Moderator</option>
                <option value="user">User</option>
              </select>
              <select id="userStatusFilter" class="text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none">
                <option value="">All statuses</option>
                <option value="active">Active</option>
                <option value="suspended">Suspended</option>
                <option value="banned">Banned</option>
              </select>
              <button id="exportUsersBtn" class="text-sm px-3 py-2 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50">Export CSV</button>
            </div>
          </div>
          <div class="bg-white shadow rounded-lg overflow-x-auto">
            <div id="usersContainer"></div>
          </div>
          <div id="usersPagination" class="flex items-center justify-between mt-4 text-sm text-gray-500"></div>
        </section>

        <!-- ===== TRIPS TAB ===== -->
        <section id="tab-trips" class="tab-panel">
          <div class="flex flex-col sm:flex-row gap-3 sm:items-center justify-between mb-4">
            <div class="relative flex-1 max-w-sm">
              <input id="tripSearch" type="text" placeholder="Search title or destination..." class="w-full pl-9 pr-3 py-2 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
              <svg class="w-4 h-4 text-gray-400 absolute left-3 top-2.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" /></svg>
            </div>
            <div class="flex items-center gap-2">
              <select id="tripStatusFilter" class="text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none">
                <option value="">All statuses</option>
                <option value="open">Open</option>
                <option value="closed">Closed</option>
                <option value="full">Full</option>
              </select>
              <button id="exportTripsBtn" class="text-sm px-3 py-2 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50">Export CSV</button>
            </div>
          </div>
          <div class="bg-white shadow rounded-lg overflow-x-auto">
            <div id="tripsContainer"></div>
          </div>
          <div id="tripsPagination" class="flex items-center justify-between mt-4 text-sm text-gray-500"></div>
        </section>

        <!-- ===== JOIN REQUESTS TAB ===== -->
        <section id="tab-requests" class="tab-panel">
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
              <select id="requestStatusFilter" class="text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none">
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
                <option value="">All</option>
              </select>
            </div>
          </div>
          <div class="bg-white shadow rounded-lg overflow-x-auto">
            <div id="requestsContainer"></div>
          </div>
        </section>

        <!-- ===== ACTIVITY LOG TAB ===== -->
        <section id="tab-activity" class="tab-panel">
          <div class="flex items-center justify-between mb-4">
            <p class="text-sm text-gray-500">Audit trail of admin actions performed in this browser.</p>
            <button id="clearLogBtn" class="text-sm px-3 py-2 rounded-lg border border-gray-200 text-red-500 hover:bg-red-50">Clear Log</button>
          </div>
          <div class="bg-white shadow rounded-lg overflow-x-auto">
            <div id="activityContainer"></div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <!-- ============ EDIT USER MODAL ============ -->
  <div id="userModal" class="fixed inset-0 z-40 hidden items-center justify-center modal-backdrop">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md mx-4 p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-gray-900">Edit User</h3>
        <button class="modal-close text-gray-400 hover:text-gray-600" data-modal="userModal">✕</button>
      </div>
      <div id="userModalBody" class="space-y-4"></div>
    </div>
  </div>

  <!-- ============ TRIP DETAILS MODAL ============ -->
  <div id="tripModal" class="fixed inset-0 z-40 hidden items-center justify-center modal-backdrop">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg mx-4 p-6 max-h-[85vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-gray-900">Trip Details</h3>
        <button class="modal-close text-gray-400 hover:text-gray-600" data-modal="tripModal">✕</button>
      </div>
      <div id="tripModalBody" class="space-y-3 text-sm"></div>
    </div>
  </div>

  <!-- ============ CONFIRM MODAL ============ -->
  <div id="confirmModal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm mx-4 p-6 text-center">
      <div class="w-12 h-12 mx-auto rounded-full bg-red-50 flex items-center justify-center mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-red-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" /></svg>
      </div>
      <h3 id="confirmTitle" class="text-lg font-semibold text-gray-900 mb-1">Are you sure?</h3>
      <p id="confirmMessage" class="text-sm text-gray-500 mb-6">This action cannot be undone.</p>
      <div class="flex gap-3">
        <button id="confirmCancelBtn" class="flex-1 py-2.5 rounded-lg border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50">Cancel</button>
        <button id="confirmOkBtn" class="flex-1 py-2.5 rounded-lg bg-red-600 text-white text-sm font-medium hover:bg-red-700">Confirm</button>
      </div>
    </div>
  </div>

  <!-- ============ TOASTS ============ -->
  <div id="toastContainer" class="fixed bottom-6 right-6 z-[60] space-y-2"></div>

  <script src="js/storage.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
